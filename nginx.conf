# App-specific headers only. HSTS, X-Frame-Options, nosniff, Referrer-Policy and
# Permissions-Policy come from the VPS edge (vps: nginx/snippets/security-headers.conf).
#
# All add_header lines stay at server level: nginx drops them in any location
# that sets its own. Cache-Control varies by path through this map instead.
map $uri $loopbox_cache {
  ~^/assets/                                     "public, max-age=31536000, immutable";
  ~^/(index\.html|sw\.js|manifest\.webmanifest)$ "no-cache";
  default                                        "public, max-age=3600";
}

server {
  listen 3000;
  root /usr/share/nginx/html;

  # ffmpeg.wasm (MP3 export) needs SharedArrayBuffer, i.e. cross-origin isolation.
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;
  add_header Cache-Control $loopbox_cache always;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json application/wasm image/svg+xml;

  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
  }

  # SPA fallback: unknown paths get the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
